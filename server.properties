bind-address=0.0.0.0
server-port=25565
log-level=debug
log-file=

# Lowest log level that shuts the server down: never, fatal (default), critical,
# error or warn.
log-exit-level=fatal

# World generation seed. Numbers are used as-is, other text is hashed.
level-seed=terila

# World generator. normal streams the terrain (oceans, hills, biomes, trees),
# flat streams the classic superflat layer cake.
level-type=normal

# Mojang session authentication. false lets cracked ("offline") clients join.
online-mode=false

# Encrypt the connection with AES/CFB8 after an RSA key exchange. Independent from
# online-mode: cracked clients can be encrypted too.
network-encryption=false

# Chunk radius sent around the player, in chunks (vanilla default 10).
view-distance=16

# Radius used for ticking. The server has no entities yet, so this is only parsed.
simulation-distance=16