name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/melikeymen/Terila/blob/main/CLA.md"
          branch: "main"
          allowlist: dependabot[bot],github-actions[bot],bot*
          create-file-commit-message: "chore: create the file that stores CLA signatures"
          signed-commit-message: "$contributorName signed the CLA in $owner/$repo#$pullRequestNo"
          custom-notsigned-prcomment: |
            Thank you for your contribution.

            Terila asks every contributor to sign the CLA once before their first pull request is merged. It is one comment: read [CLA.md](https://github.com/melikeymen/Terila/blob/main/CLA.md), then post the sentence below in this pull request.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
          lock-pullrequest-aftermerge: false
